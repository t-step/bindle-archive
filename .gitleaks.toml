# Gitleaks config for Bindle: the default secret rules, extended with
# personal-info rules mirroring bin/check-private-info.sh (which is the
# always-on, dependency-free layer; Gitleaks adds history-wide sweeps).
#
# Run on demand (not required for basic repo use):
#   brew install gitleaks
#   gitleaks detect --source . --redact
#
# See docs/privacy-boundaries.md for the model.

title = "Bindle"

[extend]
useDefault = true

[allowlist]
description = "files whose job is to document/encode these patterns"
paths = [
  '''bin/check-private-info\.sh''',
  '''\.gitleaks\.toml''',
  # HISTORY-ONLY (#384). These three paths no longer exist in the working
  # tree -- the architecture-projection and structural-graph surfaces were
  # removed -- but `gitleaks git .` scans every COMMIT, so the fictional
  # /Users/... fixtures they contained still produce findings from history.
  # The entries stay until the history does. Same class as #362.
  '''bin/structural_graph/redaction\.py''',
  '''testdata/structural-graph/v\d+/privacy/.*''',
  '''bin/architecture/tests/test_exclusions\.py''',
  # Quotes redaction.py's pattern source and the adversarial privacy fixtures
  # verbatim (a fictional /Users/jane path, a fake ghp_ token). Every hit
  # carries an inline `private-ok` marker, which bin/check-private-info.sh
  # honors and gitleaks has no equivalent for. Allowlisted as one file, not as
  # docs/superpowers/plans/**: a blanket tree exemption is what #227's
  # narrowing moved away from.
  '''docs/superpowers/plans/2026-07-18-structural-graph-interchange\.md''',
]

[[rules]]
id = "apple-private-relay-email"
description = "Apple private-relay email (identifies a personal account)"
regex = '''[A-Za-z0-9._%+-]+@privaterelay\.appleid\.com'''
keywords = ["privaterelay"]

[[rules]]
id = "local-macos-home-path"
description = "Absolute macOS home path (leaks the local username)"
regex = '''/Users/[A-Za-z][A-Za-z0-9._-]*/'''
keywords = ["/Users/"]

[[rules]]
id = "obsidian-vault-path"
description = "Obsidian/iCloud vault path (personal notes location)"
regex = '''iCloud~md~obsidian'''
keywords = ["obsidian"]
