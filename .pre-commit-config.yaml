# Pre-commit checks for Bindle. Enable locally with `bin/install-hooks.sh`
# (installs the pre-commit + post-merge stages); CI runs `pre-commit run
# --all-files`. shellcheck and shfmt are managed here, so they're enforced even
# if you don't have them installed system-wide.
default_install_hook_types: [pre-commit, post-merge]

repos:
  # Standard, widely-used hooks.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md] # keep intentional md hard breaks
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: no-commit-to-branch # block direct commits to main; work on a branch, PR to main
        args: [--branch, main]
        stages: [pre-commit] # only guard commits; must not fire on post-merge (git pull)

  # Managed shellcheck (no system install needed).
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # Managed shfmt (downloads its own binary).
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: [-i, "2", -ci, -d]

  # Bindle-specific checks and tests.
  - repo: local
    hooks:
      - id: bindle-private-info
        name: private-info scan (personal data stays out of commits)
        entry: bin/check-private-info.sh
        language: script
        types: [text]
      - id: bindle-content
        name: Bindle content (frontmatter/name/links/version)
        entry: bin/check.sh --content-only
        language: script
        pass_filenames: false
        always_run: true
      # One hook, every suite. Suites are DISCOVERED (any tracked
      # bin/test-*.sh), not registered here one at a time — hand-registration
      # is what let eleven suites run under `make test` while never reaching
      # the commit gate (#256, #257). Adding a suite requires no edit to this
      # file; it is covered the moment it is tracked.
      #
      # language: python (not script) because a discovered suite —
      # test-context-graph-schema.sh — imports jsonschema, and pre-commit only
      # provisions it for a python hook.
      - id: bindle-test-suites
        name: test suites (discovered bin/test-*.sh)
        entry: bin/run-test-suites.sh
        language: python
        additional_dependencies: ["jsonschema"]
        pass_filenames: false
        always_run: true
      - id: bindle-link
        name: link new items into ~/.claude (post-merge)
        entry: bin/install.sh
        args: [--allow-conflicts] # report conflicts (e.g. a user-owned CLAUDE.md) without failing the pull
        language: script
        pass_filenames: false
        always_run: true
        stages: [post-merge]
