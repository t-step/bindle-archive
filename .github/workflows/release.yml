name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify and publish tagged release provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 bin/release-publication.py
          --repo "$GITHUB_REPOSITORY"
          --tag "$GITHUB_REF_NAME"
