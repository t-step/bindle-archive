name: CI

# THIS WORKFLOW DOES NOT RUN, AND IS NOT A GATE (#267).
#
# Two independent conditions, both observed rather than inferred:
#
#   1. Runs do not start. Every run since at least 2026-07-15 has failed within
#      seconds with an account-level billing annotation ("recent account
#      payments have failed or your spending limit needs to be increased"). The
#      operator has decided not to resolve that condition, so this is a standing
#      state and not an outage to wait out.
#   2. A status check could not be *required* even if runs worked. This repo is
#      private, and `GET /repos/:owner/:repo/branches/main/protection` answers
#      403 "Upgrade to GitHub Pro or make this repository public to enable this
#      feature" — so there is no branch protection to enforce anything, and an
#      earlier version of this comment claiming the PR run was "the primary
#      gate — enforced in branch protection" described a setting this repo
#      cannot have.
#
# The gate of record is therefore local, and always was in practice: the
# pre-commit hooks at commit time, `make check`, and `make test`
# (`bin/run-test-suites.sh`). The all-files sweep this job would have run is
# available locally as the same command with the same SKIP:
#   SKIP=no-commit-to-branch pre-commit run --all-files --show-diff-on-failure
#
# The file is kept, not deleted, because both conditions are account/visibility
# settings rather than anything about the code: making the repo public (or
# restoring billing) makes this workflow correct again as written. Until then, a
# red badge here carries no information about the change that produced it.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC — catches environmental drift even with no recent pushes.

# A new push to a PR cancels the older in-flight run for that PR. main-push and
# scheduled runs don't cancel each other or any PR run: they're keyed by event
# name as well as ref, and only PR runs opt into cancel-in-progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install pre-commit
        # no-commit-to-branch is a local guard against committing on main in a
        # dev checkout; it has nothing to check against a push/schedule/PR
        # event and would only ever fail spuriously here, so skip it in CI.
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch
